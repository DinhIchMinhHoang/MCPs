[project]
name = "forge-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.8.2",
  "mcp>=0.2.0",
  "sentence-transformers>=3.0.1",
  "torch>=2.3.1",
  "jsonschema>=4.23.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.2"
]

[build-system]
requires = ["setuptools>=68.2.2"]
build-backend = "setuptools.build_meta"
